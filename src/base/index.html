<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>novel.global</title>
<meta name="description" content="What have you noticed?">
<meta name="theme-color" content="#17457F">
<meta name="da-build" content="%BUILD%">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="iruk.svg" type="image/svg+xml">
<link rel="icon" href="iruk-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="iruk-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
/* a link made by the studio (a mix, a story code, a page by name) goes on to the studio, so every printed code still opens; a song's link stays for the aura */
(function () { var h = location.hash.slice(1); if (h && !/^(radio|wish|shop|print|showcase|pixel|search|guide|now|songs?=[-.0-9v~%7E]+|mix=.+|booth(=[a-z0-9-]+)?|n=[A-Z0-9-]+)$/i.test(h)) location.replace('studio' + location.search + location.hash); })();
/* the aura (aura.js) is the start, unless the base is asked for by name (?base) */
if (!/[?&]base\b/.test(location.search)) document.documentElement.classList.add('aura-on');
try { var t = localStorage.getItem('da.base.theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) { /* no storage */ }
/*BASE*/
</script>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="aura.css">
</head>
<body>
<!-- the glyphs: drawn once, used everywhere. Sticks, beads, dotted threads; no words -->

<div id="terrain" aria-hidden="true"><div id="tiles"></div><svg id="net"></svg></div>

<header id="top">
  <a id="mark" href="./">novel.global</a>
  <span class="sp"></span>
  <!-- every way on, in one bar, in order: the three pages, then the map and the guide; + adds to the map while it is open -->
  <a class="g pg" href="#radio" aria-label="RADIO" title="RADIO"><svg><use href="#g-radio"/></svg></a>
  <a class="g pg" href="#wish" aria-label="W.I.S.H." title="W.I.S.H."><svg><use href="#g-wish"/></svg></a>
  <a class="g pg" href="#print" aria-label="PRINT" title="PRINT"><svg><use href="#g-shop"/></svg></a>
  <i class="bar-gap"></i>
  <button id="b-map" class="g" aria-label="Map" title="Map"><svg><use href="#g-map"/></svg></button>
  <button id="b-search" class="g" aria-label="Guide" title="Guide"><svg><use href="#g-guide"/></svg></button>
  <label id="b-add" class="g" aria-label="Add photographs, calls or icons to the map" title="Add photographs, calls or icons to the map">+<input id="m-add" type="file" accept="image/*,audio/*" multiple hidden></label>
  <button id="b-me" class="g" aria-label="Where I am" title="Where I am">◎</button>
  <button id="b-theme" class="g" aria-label="Light or dark" title="Light or dark"><svg><use href="#g-theme"/></svg></button>
</header>

<main id="home">
  <!-- the start: blueprint paper and three hand-drawn rings turning slowly as one planet. On each ring a dot carries a page:
       RADIO a signal, W.I.S.H. an irukandji as the bark painting draws one, PRINT a receipt. No words -->
  <div id="orrery">
    <svg id="rings" viewBox="-200 -200 400 400" aria-hidden="true"><g id="rg"></g></svg>
    <a class="orb" id="o-radio" href="#radio" aria-label="RADIO" title="RADIO"><i class="pt"></i><svg class="num" viewBox="0 0 10 16" aria-hidden="true"><path d="M2.6 4.4c1.4-.6 2.6-1.7 3.4-2.8.3 3.9 0 8.1.4 11.8"/></svg><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="19" r="2.2" class="f"/><path d="M16 21.5v8.5M12.4 15.2a5.2 5.2 0 0 1 7.2 0M9.3 12.1a9.6 9.6 0 0 1 13.4 0M6.2 9a14 14 0 0 1 19.6 0"/><path d="M11.5 30h9" /></svg></a>
    <a class="orb" id="o-wish" href="#wish" aria-label="W.I.S.H." title="W.I.S.H."><i class="pt"></i><svg class="num" viewBox="0 0 10 16" aria-hidden="true"><path d="M1.8 4.6c.8-2.3 5.1-2.7 5.5.2.3 2.3-2.7 4.7-5.3 8.4 1.9-.5 3.9-.3 5.7.1"/></svg><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 13.5C9 8 12 5 16 5s7 3 7 8.5v1.2H9z"/><g class="f"><circle cx="13" cy="9.6" r=".9"/><circle cx="16" cy="8.6" r=".9"/><circle cx="19" cy="9.6" r=".9"/><circle cx="12.4" cy="12.4" r=".9"/><circle cx="15.2" cy="12" r=".9"/><circle cx="18" cy="12" r=".9"/><circle cx="20.4" cy="12.6" r=".9"/></g><path d="M10 14.7c-.6 5 .8 9-1 15M14 14.7c.4 5-.6 9 .4 15M18 14.7c-.4 5 .6 9-.4 15M22 14.7c.6 5-.8 9 1 15" class="t"/></svg></a>
    <a class="orb" id="o-print" href="#print" aria-label="PRINT" title="PRINT"><i class="pt"></i><svg class="num" viewBox="0 0 10 16" aria-hidden="true"><path d="M2 3.4c1.7-1.7 5.5-1.5 5.3 1.1-.1 1.6-1.9 2.4-3.5 2.6 2.5-.2 4.1.8 3.9 3.1-.3 2.9-4.5 3.3-5.9 1.6"/></svg><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 3h14v24l-2.3-1.6-2.3 1.6-2.4-1.6-2.4 1.6-2.3-1.6L9 27z"/><path d="M12 9h8M12 13h8M12 17h5"/></svg></a>
  </div>
</main>
