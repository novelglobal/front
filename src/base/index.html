<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>novel.global</title>
<meta name="description" content="What have you noticed?">
<meta name="theme-color" content="#17457F">
<meta name="da-build" content="%BUILD%">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
/* a link made by the studio (a mix, a story code, a page by name) goes on to the studio, so every printed code still opens */
(function () { var h = location.hash.slice(1); if (h && !/^(radio|wish|shop|print|pixel|search|guide|now|booth(=[a-z0-9-]+)?|n=[A-Z0-9-]+)$/i.test(h)) location.replace('studio' + location.search + location.hash); })();
try { var t = localStorage.getItem('da.base.theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) { /* no storage */ }
/*BASE*/
</script>
<link rel="stylesheet" href="base.css">
</head>
<body>
<!-- the glyphs: drawn once, used everywhere. Sticks, beads, dotted threads; no words -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="g-radio" viewBox="0 0 24 24"><circle cx="12" cy="15" r="1.6" class="f"/><path d="M7.5 10.5a6.4 6.4 0 0 1 9 0M4.3 7.3a11 11 0 0 1 15.4 0" class="d"/><path d="M12 15v6"/></symbol>
  <symbol id="g-wish" viewBox="0 0 24 24"><path d="M1 12h22"/><circle cx="5" cy="12" r="1.8" class="f"/><circle cx="10" cy="12" r="1.8" class="f"/><circle cx="15" cy="12" r="1.8" class="f"/><circle cx="20" cy="12" r="1.8" class="f"/></symbol>
  <symbol id="g-shop" viewBox="0 0 24 24"><path d="M6 3h12v16l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4L6 19z"/><path d="M9 8h6M9 11h6M9 14h3"/></symbol>
  <symbol id="g-map" viewBox="0 0 24 24"><path d="M2 7h20M2 17h20M7 2v20M17 2v20"/><path d="M7 7l10 10" class="d"/><circle cx="12" cy="12" r="1.6" class="f"/></symbol>
  <symbol id="g-guide" viewBox="0 0 24 24"><circle cx="5" cy="6" r="1.4" class="f"/><circle cx="5" cy="12" r="1.4" class="f"/><circle cx="5" cy="18" r="1.4" class="f"/><path d="M9 6h11M9 12h11M9 18h7"/></symbol>
  <symbol id="g-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="f"/></symbol>
  <symbol id="g-print" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H3v-8h18v8h-3M7 14h10v7H7z"/></symbol>
  <symbol id="g-jelly" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 16 0z" class="f"/><path d="M6 14v7M10 14v8M14 14v8M18 14v7" class="d"/></symbol>
  <symbol id="g-sos" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></symbol>
  <symbol id="g-tiles" viewBox="0 0 24 24"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/></symbol>
  <symbol id="g-pixel" viewBox="0 0 24 24"><path d="M3 3h6v6H3zM9 9h6v6H9zM15 15h6v6h-6zM15 3h6v6h-6zM3 15h6v6H3z" class="f"/></symbol>
  <symbol id="g-sign" viewBox="0 0 24 24"><path d="M3 4h18v6H3z" class="f"/><path d="M3 4h18v16H3zM6 14h12M6 17h8"/></symbol>
  <symbol id="g-qr" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3z"/><path d="M6 6h1v1H6zM17 6h1v1h-1zM6 17h1v1H6zM14 14h3v3h-3zM18 18h3v3h-3zM18 14h3M14 18v3" class="f"/></symbol>
  <symbol id="g-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" class="d"/></symbol>
</svg>

<div id="terrain" aria-hidden="true"><div id="tiles"></div><svg id="net"></svg></div>

<header id="top">
  <a id="mark" href="./">novel.global</a>
  <span class="sp"></span>
  <button id="b-map" class="g" aria-label="Map" title="Map"><svg><use href="#g-map"/></svg></button>
  <button id="b-search" class="g" aria-label="Guide" title="Guide"><svg><use href="#g-guide"/></svg></button>
  <button id="b-theme" class="g" aria-label="Light or dark" title="Light or dark"><svg><use href="#g-theme"/></svg></button>
</header>

<main id="home">
  <!-- the start: blueprint paper and three hand-drawn rings turning slowly as one planet. On each ring a dot carries a page:
       RADIO a signal, W.I.S.H. an irukandji as the bark painting draws one, PRINT a receipt. No words -->
  <div id="orrery">
    <svg id="rings" viewBox="-200 -200 400 400" aria-hidden="true"><g id="rg"></g></svg>
    <a class="orb" id="o-radio" href="#radio" aria-label="RADIO" title="RADIO"><i class="pt"></i><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="19" r="2.2" class="f"/><path d="M16 21.5v8.5M12.4 15.2a5.2 5.2 0 0 1 7.2 0M9.3 12.1a9.6 9.6 0 0 1 13.4 0M6.2 9a14 14 0 0 1 19.6 0"/><path d="M11.5 30h9" /></svg></a>
    <a class="orb" id="o-wish" href="#wish" aria-label="W.I.S.H." title="W.I.S.H."><i class="pt"></i><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 13.5C9 8 12 5 16 5s7 3 7 8.5v1.2H9z"/><g class="f"><circle cx="13" cy="9.6" r=".9"/><circle cx="16" cy="8.6" r=".9"/><circle cx="19" cy="9.6" r=".9"/><circle cx="12.4" cy="12.4" r=".9"/><circle cx="15.2" cy="12" r=".9"/><circle cx="18" cy="12" r=".9"/><circle cx="20.4" cy="12.6" r=".9"/></g><path d="M10 14.7c-.6 5 .8 9-1 15M14 14.7c.4 5-.6 9 .4 15M18 14.7c-.4 5 .6 9-.4 15M22 14.7c.6 5-.8 9 1 15" class="t"/></svg></a>
    <a class="orb" id="o-print" href="#print" aria-label="PRINT" title="PRINT"><i class="pt"></i><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 3h14v24l-2.3-1.6-2.3 1.6-2.4-1.6-2.4 1.6-2.3-1.6L9 27z"/><path d="M12 9h8M12 13h8M12 17h5"/></svg></a>
  </div>
</main>

<!-- the only words: a small screen, as an unhoused OLED module; pressed, the guide -->
<button id="oled" aria-label="Now" title="Now"><i class="pins" aria-hidden="true"></i><span class="l1"></span><span class="l2"><span></span></span></button>

<nav id="dock" hidden>
  <a href="#radio" class="g" aria-label="RADIO" title="RADIO"><svg><use href="#g-radio"/></svg></a>
  <label class="eye sm" aria-label="Photograph" title="What have you noticed?"><svg viewBox="0 0 160 120" aria-hidden="true"><path class="stick" d="M16 54Q80 4 144 54"/><path class="stick" d="M16 54Q80 104 144 54"/><circle class="iris" cx="80" cy="54" r="19"/><g class="pupil"><ellipse cx="80" cy="54" rx="8" ry="6"/></g></svg><input class="shot" type="file" accept="image/*" capture="environment"></label>
  <a href="#wish" class="g" aria-label="W.I.S.H." title="W.I.S.H."><svg><use href="#g-wish"/></svg></a>
  <a href="#print" class="g" aria-label="PRINT" title="PRINT"><svg><use href="#g-shop"/></svg></a>
</nav>

<section id="sheet" hidden></section>

<nav id="maptools"><label class="g" aria-label="Add photographs, calls or icons" title="Add photographs, calls or icons">+<input id="m-add" type="file" accept="image/*,audio/*" multiple hidden></label><button id="m-close" class="g" aria-label="Close the map" title="Close the map">×</button></nav>

<div id="tip" hidden></div>
<p id="credit"></p>
<noscript><p class="nojs">novel.global — Emergencies 000. Injured wildlife: Wildlife Victoria (03) 8400 7300.</p></noscript>
<script src="base.js"></script>
</body>
</html>
