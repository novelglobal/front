<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Approval</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  /* the approval page: a plain, official desk. Navy bar and rail, white sheets on a cool paper, one accent for what is on */
  :root { --navy:#0B2545; --navy2:#13315C; --ink:#141412; --paper:#EEF1F5; --sheet:#FFFFFF; --line:#D5DBE4; --grey:#5F6B7A; --soft:#8A94A3;
    --teal:#0CCBBD; --teal-wash:#E3F7F4; --coral:#E25C40; --red:#C62D1F; --cobalt:#0067B8; --slip:#FCFBF7;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace; --sans:'Inter','Poppins',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 13.5px/1.5 var(--sans); }
  header { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: var(--navy); color: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  header .brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; }
  header .brand svg { width: 34px; height: 16px; display: block; }
  header b { font: 600 11px var(--mono); letter-spacing: .16em; }
  header small { font: 500 10px var(--mono); letter-spacing: .1em; opacity: .65; }
  #out { margin-left: auto; }
  .shell { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: calc(100vh - 52px); }
  nav#tabs { display: flex; flex-direction: column; gap: 2px; padding: 14px 10px; background: var(--navy2); position: sticky; top: 52px; align-self: start; height: calc(100vh - 52px); overflow-y: auto; }
  nav#tabs[hidden] { display: none; }
  nav#tabs .grp { font: 600 9.5px var(--mono); letter-spacing: .16em; color: rgba(255,255,255,.45); margin: 12px 8px 4px; }
  nav#tabs button { text-align: left; border: 0; border-radius: 6px; background: transparent; color: #DCE6F2; padding: 8px 10px; font: 500 11px var(--mono); letter-spacing: .08em; display: flex; justify-content: space-between; align-items: center; }
  nav#tabs button:hover { background: rgba(255,255,255,.08); }
  nav#tabs button.on { background: #fff; color: var(--navy); }
  nav#tabs .n { font-size: 10px; min-width: 20px; padding: 1px 6px; border-radius: 9px; background: var(--coral); color: #fff; text-align: center; }
  nav#tabs .n:empty { display: none; }
  button { font: 500 10.5px var(--mono); letter-spacing: .08em; padding: 7px 11px; border: 1px solid var(--navy); border-radius: 5px; background: #fff; color: var(--navy); cursor: pointer; }
  button:hover { background: var(--teal-wash); }
  button:disabled { opacity: .45; cursor: default; }
  button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  button.no { color: var(--red); border-color: var(--red); }
  header button { border-color: rgba(255,255,255,.5); background: transparent; color: #fff; }
  main { max-width: 1040px; width: 100%; padding: 22px 24px 60px; }
  main > h2 { margin: 0 0 4px; font: 600 20px var(--sans); color: var(--navy); }
  main > .lede { margin: 0 0 18px; color: var(--grey); max-width: 70ch; }
  .gate { max-width: 380px; margin: 12vh auto; padding: 26px; background: #fff; border: 1px solid var(--line); border-radius: 10px; display: grid; gap: 10px; }
  .gate input { width: 100%; padding: 11px; border: 1px solid var(--navy); border-radius: 6px; font: 14px var(--mono); }
  .note { font: 500 10px/1.6 var(--mono); letter-spacing: .07em; color: var(--grey); }
  .card, .printer, .ed, .post-row, .tile { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; }
  .card { display: grid; grid-template-columns: 140px 1fr; gap: 16px; padding: 16px; margin: 0 0 10px; }
  .card.rec { grid-template-columns: 1fr; }
  #main > .card:not(:has(img)) { grid-template-columns: 1fr; }
  .card img { width: 140px; height: 140px; object-fit: cover; background: var(--paper); border-radius: 6px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card .meta { font: 500 10px var(--mono); letter-spacing: .06em; color: var(--grey); margin-bottom: 8px; }
  .card ol { margin: 6px 0; padding-left: 18px; font: 600 12.5px var(--mono); }
  .card p { margin: 4px 0; }
  .card .acts, .printer .acts { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .card .done { font: 600 10px var(--mono); letter-spacing: .1em; color: var(--cobalt); }
  .pform { display: grid; gap: 6px; margin-top: 8px; }
  .pform input, .pform select { font: 500 13px var(--mono); padding: 8px; border: 1px solid #A7B1BF; border-radius: 5px; background: #fff; }
  .lbl { font: 600 11px var(--mono); letter-spacing: .12em; margin: 22px 0 8px; color: var(--navy); }
  .empty { padding: 34px; text-align: center; color: var(--grey); font: 500 11px var(--mono); letter-spacing: .1em; }
  .printer { padding: 16px; margin: 0 0 10px; }
  .printer h3, .ed h3 { margin: 0 0 4px; font-size: 15px; color: var(--navy); }
  .token { margin-top: 10px; padding: 10px; background: var(--slip); border: 1px dashed var(--navy); border-radius: 6px; font: 12px/1.5 var(--mono); word-break: break-all; white-space: pre-wrap; }
  .post-row { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; margin: 0 0 6px; }
  .post-row img, .post-row .ph { width: 56px; height: 56px; object-fit: cover; background: var(--paper); display: block; border-radius: 6px; }
  .post-row b { display: block; font-size: 14px; }
  .ed { display: grid; gap: 10px; padding: 16px; margin: 0 0 10px; }
  .ed label { display: grid; gap: 4px; font: 500 10px var(--mono); letter-spacing: .1em; color: var(--grey); }
  .ed input, .ed textarea, .ed select { width: 100%; padding: 8px; border: 1px solid #A7B1BF; border-radius: 5px; font: 14px/1.5 var(--sans); color: var(--ink); background: #fff; }
  .ed textarea.body { min-height: 260px; font: 12.5px/1.5 var(--mono); }
  .ed .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ed .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .ed .cv { width: 160px; height: 110px; object-fit: cover; background: var(--paper); display: block; }
  .ed .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .ed .check { display: flex; gap: 8px; align-items: center; font: 500 12px var(--sans); letter-spacing: 0; color: var(--ink); }
  .ed .check input { width: auto; }
  /* the overview: tiles of what is waiting and how it is going */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 0 0 18px; }
  .tile { padding: 14px; display: grid; gap: 2px; cursor: pointer; text-align: left; font: inherit; color: inherit; border-radius: 10px; }
  .tile:hover { border-color: var(--navy); background: #fff; }
  .tile b { font: 600 26px/1.1 var(--sans); color: var(--navy); }
  .tile span { font: 500 10px var(--mono); letter-spacing: .1em; color: var(--grey); }
  .tile.hot b { color: var(--coral); }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font: 12px var(--mono); }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; font-size: 10px; letter-spacing: .1em; color: var(--grey); background: #F7F9FB; }
  td .bar { display: inline-block; height: 8px; background: var(--teal); border-radius: 4px; vertical-align: middle; margin-right: 6px; }
  /* the guide: plain reading */
  .guide { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; margin: 0 0 12px; max-width: 78ch; }
  .guide h3 { margin: 0 0 8px; color: var(--navy); font-size: 16px; }
  .guide p, .guide li { line-height: 1.6; }
  .guide code, .guide pre { font: 12px/1.5 var(--mono); background: var(--paper); border-radius: 4px; padding: 1px 5px; }
  .guide pre { padding: 10px 12px; overflow-x: auto; white-space: pre; }
  .guide a { color: var(--cobalt); }
  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; }
    nav#tabs { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 8px; }
    nav#tabs .grp { display: none; }
    main { padding: 14px; }
    .card { grid-template-columns: 1fr; } .card img { width: 100%; height: auto; aspect-ratio: 1; }
    .ed .two, .ed .three { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header><a class="brand" href="/" aria-label="novel.global"><svg viewBox="0 0 237 112" aria-hidden="true"><rect x="10" y="10" width="91.6" height="92" fill="#fff"/><circle cx="178.3" cy="56.5" r="48.8" fill="#E25C40"/></svg><b>NOVEL.GLOBAL</b></a><small>APPROVAL</small><button type="button" id="out">LOCK</button></header>
<div class="shell">
<nav id="tabs" hidden aria-label="Sections">
  <span class="grp">AT A GLANCE</span><button type="button" data-tab="overview">OVERVIEW</button>
  <span class="grp">WHAT WAS SENT</span><button type="button" data-tab="waiting">WAITING <i class="n" id="n-waiting"></i></button><button type="button" data-tab="shown">SHOWN</button><button type="button" data-tab="refused">REFUSED</button><button type="button" data-tab="deleted">ARCHIVE</button>
  <span class="grp">THE SITE</span><button type="button" data-tab="places">PLACES <i class="n" id="n-places"></i></button><button type="button" data-tab="printers">PRINTERS</button><button type="button" data-tab="stations">WORDS AND BOARDS</button><button type="button" data-tab="posts">PORTFOLIO</button><button type="button" data-tab="site">SETTINGS</button>
  <span class="grp">KEEPING IT</span><button type="button" data-tab="data">DATA</button><button type="button" data-tab="guide">GUIDE</button>
</nav>
<main id="main">
  <form class="gate" id="gate">
    <b>Approval</b>
    <input id="key" type="password" autocomplete="current-password" aria-label="Password" placeholder="Password" required>
    <button type="submit">OPEN</button>
    <p class="note" id="gate-note">THE ADMIN_KEY SECRET SET IN CLOUDFLARE · KEPT ONLY IN THIS TAB</p>
  </form>
</main>
</div>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
