<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Approval</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --teal:#0CCBBD; --teal-wash:#E3F7F4; --navy:#0B2545; --ink:#141412; --paper:#F1F2EF; --slip:#FCFBF7; --grey:#6B6B6B; --red:#D62E1F; --cobalt:#0067B8;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace; --sans:'Poppins',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 13px/1.45 var(--sans); }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--navy); color: #fff; flex-wrap: wrap; }
  header b { font: 600 11px var(--mono); letter-spacing: .14em; }
  nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  button { font: 500 10.5px var(--mono); letter-spacing: .08em; padding: 7px 10px; border: 1px solid var(--navy); background: #fff; color: var(--navy); cursor: pointer; }
  button:hover { background: var(--teal-wash); }
  button.on { background: var(--teal); border-color: var(--teal); color: var(--navy); }
  button.no { color: var(--red); border-color: var(--red); }
  header button { border-color: rgba(255,255,255,.5); background: transparent; color: #fff; }
  header button.on { background: #fff; color: var(--navy); }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  .gate { max-width: 360px; margin: 12vh auto; padding: 20px; background: #fff; }
  .gate input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid var(--navy); font: 14px var(--mono); }
  .note { font: 500 10px var(--mono); letter-spacing: .08em; color: var(--grey); }
  .card { display: grid; grid-template-columns: 140px 1fr; gap: 14px; padding: 14px; margin: 0 0 10px; background: #fff; }
  .card.rec { grid-template-columns: 1fr; }
  .card img { width: 140px; height: 140px; object-fit: cover; background: var(--paper); }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card .meta { font: 500 10px var(--mono); letter-spacing: .06em; color: var(--grey); margin-bottom: 8px; }
  .card ol { margin: 6px 0; padding-left: 18px; font: 600 12.5px var(--mono); }
  .card p { margin: 4px 0; }
  .card .acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .card .done { font: 600 10px var(--mono); letter-spacing: .1em; color: var(--cobalt); }
  .empty { padding: 30px; text-align: center; color: var(--grey); font: 500 11px var(--mono); letter-spacing: .1em; }
  .printer { padding: 14px; margin: 0 0 10px; background: #fff; }
  .printer h3 { margin: 0 0 4px; font-size: 15px; }
  .printer .acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .token { margin-top: 10px; padding: 10px; background: var(--slip); border: 1px dashed var(--navy); font: 12px/1.5 var(--mono); word-break: break-all; white-space: pre-wrap; }
  @media (max-width: 560px) { .card { grid-template-columns: 1fr; } .card img { width: 100%; height: auto; aspect-ratio: 1; } }
</style>
</head>
<body>
<header><b>DIRECT ACTION · APPROVAL</b><nav id="tabs" hidden>
  <button type="button" data-tab="waiting" class="on">WAITING</button><button type="button" data-tab="shown">SHOWN</button><button type="button" data-tab="refused">REFUSED</button><button type="button" data-tab="printers">PRINTERS</button><button type="button" data-tab="stations">STATIONS</button><button type="button" id="out">LOCK</button>
</nav></header>
<main id="main">
  <form class="gate" id="gate">
    <b>Approval</b>
    <input id="key" type="password" autocomplete="current-password" aria-label="Password" placeholder="Password" required>
    <button type="submit">OPEN</button>
    <p class="note" id="gate-note">THE ADMIN_KEY SECRET SET IN CLOUDFLARE · KEPT ONLY IN THIS TAB</p>
  </form>
</main>
<script src="admin.js"></script>
</body>
</html>
