<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>novel.global</title>
<script>
/* an island keeper's key, scanned from the welcome slip: kept on this phone only (it travels after the #, so it never reaches a server log), then the control panel */
(function () { var m = /[#&]k=([A-Za-z0-9_-]{16,64})/.exec(location.hash); try { if (m) localStorage.setItem('da.hm.key', JSON.stringify(m[1])); } catch (e) { /* private window */ } location.replace('./?panel'); })();
</script></head><body style="background:#17457F"></body></html>
