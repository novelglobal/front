<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex">
<title>novel.global</title>
<style>
  :root { --ink: #111; --paper: #f2f1ec; --line: #111; --dim: rgba(17, 17, 17, .45); --on: #2fbf55; --bg: #d9d8d2; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ecebe6; --paper: #161718; --line: #ecebe6; --dim: rgba(236, 235, 230, .45); --bg: #0c0d0e; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 500 12px/1.2 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .win { background: var(--paper); border: 1px solid var(--line); }
  .win > header { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: var(--ink); color: var(--paper); }
  .win > header b { font-weight: 700; flex: 1; }
  .led { width: 8px; height: 8px; border-radius: 50%; border: 1px solid currentColor; display: inline-block; flex: none; }
  .on .led, .led.on { background: var(--on); border-color: var(--on); }
  .desk { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 16px; justify-items: center; }
  .stage { position: relative; height: min(72vh, 760px); aspect-ratio: 512 / 2126; background: #fff; outline: 1px solid var(--line); touch-action: none; cursor: grab; }
  .stage.wide { height: auto; width: 100%; }
  .stage.drag { cursor: grabbing; }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .stage .add { position: absolute; inset: 0; display: grid; place-items: center; font-size: 28px; color: #111; background: repeating-linear-gradient(0deg, transparent 0 11px, rgba(0, 0, 0, .06) 11px 12px); cursor: pointer; }
  .stage.has .add { display: none; }
  .side { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
  .row { display: flex; gap: 8px; }
  button, input { font: inherit; letter-spacing: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 0; padding: 10px 12px; min-height: 40px; }
  button { cursor: pointer; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
  button[aria-pressed="true"], button.on { background: var(--ink); color: var(--paper); }
  button:disabled { opacity: .35; cursor: default; }
  input { flex: 1; min-width: 0; text-transform: uppercase; }
  #to { flex-wrap: wrap; }
  #to:empty { display: none; }
  #go { min-height: 64px; font-size: 15px; font-weight: 700; background: var(--ink); color: var(--paper); }
  #st { min-height: 1.2em; margin: 0; color: var(--dim); text-align: center; }
  .sw { width: 14px; height: 14px; border: 1px solid var(--line); display: inline-block; }
  .sw.w { background: #fff; } .sw.k { background: #000; }
  input[type=file] { display: none; }
  .in { --ink: #ecebe6; --paper: #121417; --line: #ecebe6; --dim: rgba(236, 235, 230, .45); --bg: transparent; }
  .in body { background: transparent; } .in main { padding: 0; } .in .win { border: 0; background: transparent; } .in .win > header { display: none; } .in .desk { padding: 8px 0 16px; }
  .in .stage:not(.wide) { height: min(78vh, 760px); }
</style>
<script src="x.js"></script></head>
<body><main><section class="win" id="x" aria-live="polite"><header><i class="led" id="led"></i><b id="nm">·</b></header></section></main></body></html>
